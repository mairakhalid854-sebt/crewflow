# Low-cost single-VPS hosting for the knowledge scanner. Only Caddy publishes
# ports; ClamAV and the gateway stay on the internal Docker network.
name: crewflow-scanner

services:
  clamav:
    image: clamav/clamav:1.4.3
    restart: unless-stopped
    networks: [scanner]
    volumes:
      - clamav_db:/var/lib/clamav

  scanner:
    build:
      context: ../../..
      dockerfile: apps/scanner/Dockerfile
    restart: unless-stopped
    depends_on: [clamav]
    environment:
      SCANNER_AUTH_TOKEN: ${SCANNER_AUTH_TOKEN:?set SCANNER_AUTH_TOKEN in .env}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
    networks: [scanner]

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on: [scanner]
    environment:
      SCANNER_DOMAIN: ${SCANNER_DOMAIN:?set SCANNER_DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
    networks: [scanner]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

networks:
  scanner:

volumes:
  clamav_db:
  caddy_data:
  caddy_config:
