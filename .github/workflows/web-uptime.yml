name: Web uptime smoke

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Optional HTTPS target; defaults to CREWFLOW_MONITOR_URL
        required: false
        type: string
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: crewflow-web-uptime
  cancel-in-progress: true

jobs:
  smoke:
    name: Public web health and security smoke
    if: ${{ inputs.target_url != '' || vars.CREWFLOW_MONITOR_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run remote smoke checks
        env:
          CREWFLOW_SMOKE_BASE_URL: ${{ inputs.target_url || vars.CREWFLOW_MONITOR_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/web-smoke.mjs
