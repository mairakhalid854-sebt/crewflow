name: crewflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crewflow
      POSTGRES_PASSWORD: crewflow_local_only
      POSTGRES_USER: crewflow
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crewflow -d crewflow']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'
    restart: unless-stopped
    volumes:
      - crewflow_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '6379:6379'
    restart: unless-stopped
    volumes:
      - crewflow_redis:/data

volumes:
  crewflow_postgres:
  crewflow_redis:
